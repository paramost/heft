<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heft test</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#04050f;color:#dfe6ff;font-family:system-ui,sans-serif;
       min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:18px 12px}
  header{width:100%;max-width:430px;background:#161d4a;padding:14px 12px;
         font-size:22px;letter-spacing:.3em;font-weight:700}
  .block{width:100%;max-width:430px;height:40svh;margin-top:10px;
         background:linear-gradient(#1d2a6b,#0a0e2c);display:flex;
         align-items:center;justify-content:center;color:#6a74a8;font-size:14px}
  .note{margin-top:14px;font-size:13px;color:#6a74a8;text-align:center;max-width:430px}
</style>
</head>
<body>
  <header>H E F T &nbsp;TEST</header>
  <div class="block">plain block</div>
  <p class="note">If you can read the navy HEFT bar at the top, this page is fine.<br>
     No script, no fonts, no SVG, no sticky, no adaptive sizing.</p>
</body>
</html>
