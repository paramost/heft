<!DOCTYPE html>
<html lang="en" data-build="1.8.6">
<head>
<meta charset="utf-8">
<!-- Heft build 1.8.6 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HEFT</title>
<meta property="og:title" content="HEFT">
<meta property="og:description" content="A daily puzzle. Fill the hooks so the whole mobile hangs level.">
<meta property="og:url" content="https://heftdaily.com/">
<!-- the icon a link preview shows beside the title (Messages, and the home screen). The favicon
     is inline SVG, which previews ignore. Drawn by tools/icon.py; iMessage caches a preview per
     URL, so a new design is a new filename. -->
<link rel="apple-touch-icon" href="/icon-1.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161d4a'/%3E%3Cpath d='M8 7H13.5V13.25H18.5V7H24V25H18.5V17.75H13.5V25H8Z' fill='%23dfe6ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--b1:#161d4a;--b2:#0a0e2c;--b3:#04050f;--wire:#4d59a6;--rest:#c98f4a;
        --lit:#7ef0ff;--ink:#dfe6ff;--dim:#6a74a8;--go:#6ee7a0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:var(--b3)}
  html,body{margin:0;overscroll-behavior:none;touch-action:manipulation}
  body{background:radial-gradient(120% 70% at 50% 0%,var(--b1) 0%,var(--b2) 46%,var(--b3) 100%);
       color:var(--ink);font-family:Karla,system-ui,sans-serif;display:flex;flex-direction:column;
       align-items:center;min-height:100svh;padding:0 12px calc(16px + env(safe-area-inset-bottom))}
  header{align-self:center;width:calc(100% + 24px);max-width:454px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:calc(9.1px + env(safe-area-inset-top)) 12px 9.1px;border-bottom:1px solid rgba(77,89,166,.5);position:sticky;top:0;z-index:5;background:var(--b1);
         clip-path:inset(0 0 -60px 0)}  /* the lit rule's glow may spill down, never out the sides (1.6.7) */
  /* the mark's origin is the band's edge, so the H's left gap is measured from where the eye
     measures it (1.6.11); the meta's ink sits 2.9px inside its line box at both ends, so 9.1px
     of header padding is a 12px ink gap, and 12px of header padding alone is the 12px right gap */
  #mark{position:absolute;left:0;top:0;display:block;overflow:visible;pointer-events:none}
  .meta{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;line-height:1.2}
  .stage{width:100%;max-width:430px;height:48vh;height:48svh;display:flex;align-items:center;justify-content:center}
  #board{width:100%;height:100%;display:block;overflow:visible}
  /* the prompt hugs the board: same gap below the mobile whether it is one line or four */
  /* the block is centred, so its spare height splits evenly and the padding tips the
     balance: ~27px of air above the one-line message, ~17px below it */
  .prompt{font-size:13.5px;color:var(--dim);min-height:64px;padding:20px 8px 10px;margin:0;text-align:center;transition:color .35s;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* the result block is four lines and sits close under the mobile; give it room above */
  .prompt.win{color:var(--lit);padding-top:28px}
  .rack{display:flex;gap:14px;justify-content:center;align-items:flex-start;width:100%;max-width:430px}
  .stock{background:none;border:0;padding:4px;cursor:pointer;display:flex;flex-direction:column;
         align-items:center;gap:6px;transition:transform .18s cubic-bezier(.34,1.4,.5,1),opacity .25s}
  .stock svg{width:44px;height:44px;overflow:visible;display:block}
  .stock.on{transform:translateY(-8px)}
  .stock.out{opacity:.2;pointer-events:none}
  .allow{display:flex;gap:4px}
  .allow i{width:5px;height:5px;border-radius:50%;border:1px solid rgba(120,140,200,.55)}
  .allow i.used{background:var(--rest);border-color:var(--rest)}
  footer{margin-top:14px;display:flex;gap:8px}
  .btn{background:none;border:1px solid rgba(120,132,200,.3);color:var(--dim);font-family:inherit;
       font-size:12px;padding:7px 15px;border-radius:999px;cursor:pointer}
  .btn:active{color:var(--ink)}
  /* the result is ready to share; it says nothing about the puzzle that the glow hasn't */
  .btn.go{color:var(--go);border-color:rgba(110,231,160,.55);box-shadow:0 0 12px rgba(110,231,160,.18)}
  .btn.go:active{color:var(--ink)}
    /* four lines on one 22px pitch, the emoji row included, so the block reads as a stack */
  .prompt .stitle{font-size:13px;letter-spacing:.14em;color:var(--ink);font-weight:500;line-height:22px}
  .prompt .sline{font-size:13px;color:var(--dim);line-height:22px}
  .prompt .sgrid{font-size:17px;letter-spacing:2px;line-height:22px;margin:6px 0 0}  /* emoji are taller than text; 6px keeps them off the date */
  .build{margin-top:12px;font-size:11px;color:var(--dim);opacity:.55;font-variant-numeric:tabular-nums}
  .hook{cursor:pointer}
</style>
</head>
<body>

<header>
  <svg id="mark" viewBox="0 0 340 74"></svg>
  <div class="meta" id="meta"></div>
</header>
<div class="stage"><svg id="board" aria-label="A hanging mobile"></svg></div>
<div class="prompt" id="prompt">Fill the hooks so the whole mobile hangs level.</div>
<div class="rack" id="rack"></div>
<footer>
  <button class="btn" id="reset">Clear</button>
  <button class="btn" id="next" style="display:none">Next board</button>
  <button class="btn" id="copy" style="display:none">Copy result</button>
</footer>
<div class="build" id="build"></div>

<script src="boards.js"></script>
<script>
const BUILD='1.8.6';
/* the build string sits in three places so it can be read without running the page: here,
   an html attribute, and a comment in the head. Three copies can disagree, so they are
   checked against each other - a number that lies is worse than one that is hard to read. */
const BUILD_OK=(function(){ let c=null;
  [].slice.call(document.head.childNodes).forEach(function(n){
    if(n.nodeType===8){ const x=/Heft build (\S+)/.exec(n.nodeValue||''); if(x) c=x[1]; } });
  return document.documentElement.getAttribute('data-build')===BUILD && c===BUILD; })();
const WIRE='#4d59a6', REST='#c98f4a', LIT='#7ef0ff', INK='#dfe6ff';
/* Five glyphs, one per weight, each centred on its 48-unit box, with the cord stopping at the
   ink via CELL_TOP. Order is triangle, hexagon, pentagon, house, square - lightest to heaviest.
   That is the ink AREA order (438 < 546 < 609 < 652 < 841), which is the cue play has agreed
   with where compactness did not.
   FLAT TOPS, POINTS DOWN (1.6.1, Dan's call). Until 1.6.0 every shape was pointed at the top,
   on the reasoning that a cord meeting a flat edge reads as resting on it. The empty hook is a
   thin circle and the cord meets that along its edge too, so a weight meeting the cord the same
   way is the consistent reading, not the odd one - and it is how a pendant or a plumb bob hangs.
   Turning the set over made the square available and retired the diamond, which is the one
   shape a flip does nothing to. Nothing is added at the join: no bar, no loop. Bare.
   Every polygon is regular - equal sides AND equal angles. That fixes each one's proportion, so
   at a shared width the heights differ: the triangle is 27.5 tall (equilateral at 31.8 wide),
   the hexagon 25.1 (regular, flat side up, 29 wide), the rest 29. CELL_TOP carries the
   difference. The house is the one shape that is not a regular polygon; it is the only one with
   vertical edges, and flipped it is a tag.
   Nothing here states an ordering. What is left is apparent weight, and it is the hint: nothing
   on screen says which is heavier, the player forms a hypothesis and must hang something to find
   out. Do not strengthen the cue - exaggerated it becomes the label this avoids. */
/* Two glyph sets. POINT is the default from 1.6.6: pointed tops, the diamond in - play chose
   it over the flat set on a phone. FLAT is 1.6.1's: flat tops, points down, the square in;
   ?glyphs=flat draws it and prints beside the build number. Both are ordered lightest to
   heaviest by ink area. */
const GLYPH_SETS={
 flat:{
  cells:{
   prism:'M24.00 36.83L38.81 11.17L9.19 11.17z',
   hex:'M16.75 11.44L31.25 11.44L38.50 24.00L31.25 36.56L16.75 36.56L9.50 24.00z',
   pent:'M24.00 38.50L39.20 27.40L33.40 9.50L14.60 9.50L8.80 27.40z',
   house:'M24.00 38.50L39.00 24.00L39.00 9.50L9.00 9.50L9.00 24.00z',
   square:'M9.50 9.50L38.50 9.50L38.50 38.50L9.50 38.50z',
  },
  ordered:['prism','hex','pent','house','square'],                     // 380 546 609 652 841
  top:{prism:11.17, hex:11.44, pent:9.5, house:9.5, square:9.5},
 },
 point:{
  cells:{
   diamond:'M24.0 9.5L38.5 24.0L24.0 38.5L9.5 24.0z',
   prism:'M24.00 10.08L38.81 36.83L9.19 36.83z',
   hex:'M24.00 9.50L36.56 16.75L36.56 31.25L24.00 38.50L11.44 31.25L11.44 16.75z',
   pent:'M24.0 9.5L39.2 20.6L33.76 37.4L14.24 37.4L8.8 20.6z',
   house:'M24.0 9.5L39.0 24.0L39.0 37.4L9.0 37.4L9.0 24.0z',
  },
  ordered:['diamond','prism','hex','pent','house'],                   // 420 396 546 588 620 (triangle shaved, then apex raised 1px; pentagon & house bottoms trimmed ~1px, 1.7.1-1.7.4)
  top:{diamond:9.5, prism:10.08, hex:9.5, pent:9.5, house:9.5},
 },
};
const GLYPHS=(function(){ const m=location.search.match(/[?&]glyphs=(point|flat)/); return m?m[1]:'point'; })();
const CELLS=GLYPH_SETS[GLYPHS].cells;
const KEYS=Object.keys(CELLS);
const ORDERED=GLYPH_SETS[GLYPHS].ordered;   // lightest to heaviest, by apparent weight
// No weight is a filled circle: the ring was dropped in 1.5.2 because an empty socket is a
// circle too. The socket is a thin empty circle and the cord meets it at its edge, exactly as
// it meets a hung weight's top.
const CELL_TOP=GLYPH_SETS[GLYPHS].top;
const U=22, DROP=56, HOOKDROP=30, BOW=4, R=21, S=44;
/* The tilt range. 15 was the shipped value; 30 was measured and rejected as a staircase.
   Widening is the only lever that reduces invisible single-weight swaps (40.6% at 15 deg,
   34.6% at 20), but it costs vertical envelope, so the pinned scale shrinks a little. */
const MAX_TILT=(function(){ const m=/[?&]tiltmax=([\d.]+)/.exec(location.search);
  const v=m?parseFloat(m[1]):15; return ((v>=8&&v<=30)?v:15)*Math.PI/180; })();

/* The angle is proportional to the fractional torque imbalance: the tilt is the arithmetic.
   ?tilt=N raises it to a power instead, which lifts small imbalances out of the sub-pixel
   band at the cost of compressing everything above a quarter off. 1 is proportional. */
/* The smallest lean the drawing is allowed to show for an arm that is not level, in DEGREES.
   Pixels were the wrong unit: two boards whose arms differ 2.6x in length both became readable
   at about 1.1-1.2 deg, because the eye judges an arm's slope against the risers and arms
   around it, and that comparison is angular. 0 restores 1.5.2. */
const FLOOR_DEG=(function(){ const m=/[?&]floor=([\d.]+)/.exec(location.search);
  const v=m?parseFloat(m[1]):1.25; return (v>=0&&v<=6)?v:1.25; })();
const FLOOR_RAD=FLOOR_DEG*Math.PI/180;
const TILT_EXP=(function(){ const m=/[?&]tilt=([\d.]+)/.exec(location.search);
  const v=m?parseFloat(m[1]):1; return (v>0&&v<=1)?v:1; })();

/* Straight arms since 1.5.5. The old 2.5% sag carried no information and cost a great deal:
   it put ~5.7 deg of slope at each arm end, 4.6x the entire floor lean, competing with the one
   thing the arm has to say. It was also incoherent - the apex sat at the chord's midpoint
   regardless of where the anchor was, so on a 3:1 arm it arched over a point a whole unit off
   the thing holding it up. ?bow=0.025 restores it. */
const BOW_F=(function(){ const m=/[?&]bow=([\d.]+)/.exec(location.search);
  const v=m?parseFloat(m[1]):0; return (v>=0&&v<=0.2)?v:0; })();
const PUL=4.5;                       // pulley radius, in board units

/* How much the wire is lifted off the background. Brightness and stroke weight only - no
   opacity is touched, because opacity carries real signals here (a level arm draws at full
   stroke and full opacity, a leaning one does not) and lifting it would flatten them.
   ?ink=0 is exactly the 1.4.7 drawing; 1 is the default; 2 is as far as it goes. */
const INK_F=(function(){ const m=/[?&]ink=([\d.]+)/.exec(location.search);
  const v=m?parseFloat(m[1]):1; return (v>=0&&v<=2)?v:1; })();
const WIRE_B=mix(WIRE,INK,0.28*INK_F);
const WS=1+0.20*INK_F;                            // stroke width scale
function sw(base){ return (base*WS).toFixed(2); }

/* Boards are drawn at random for now; ordering waits for the daily. ?board=N pins one,
   so a link can still point at a specific puzzle. */
/* THE DAILY (1.7.0). Everyone plays the same board on the same date. The day number counts
   from the epoch below, from the local calendar date read as UTC so daylight saving cannot bend
   it; the board is that number into the bank, wrapping past 144 while the number keeps counting.
   Persistence and a streak were built in v1 and reverted as premature; this is the rebuild, and
   the design notes from that round are in heft-plan.md. `localStorage`, no backend.
   ?day=N and ?board=N are testing pins: they write nothing, so testing cannot touch a player's
   real day or streak. */
const EPOCH=Date.UTC(2026,8,15);                 // No 1 is 15 Sept 2026 (month is 0-based)
/* A cached boards.js against a fresh index.html - or a failed fetch - used to render a working-
   looking game with no mobile in it and nothing on screen saying why. Say why, and stop (1.8.4). */
if(typeof PUZZLES==='undefined' || !PUZZLES.length){
  document.getElementById('prompt').textContent='The board file did not load. Refresh the page, or reopen the link.';
  throw new Error('Heft: boards.js missing');
}
const L=PUZZLES.length;
function dayNumber(){ const t=new Date();
  return Math.floor((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-EPOCH)/86400000)+1; }
function dateForDay(n){ return new Date(EPOCH+(n-1)*86400000); }   // read with getUTC* to match the boundary
function randomBoard(not){ if(L<2) return 0; let n; do{ n=Math.floor(Math.random()*L); }while(n===not); return n; }

/* Four ways the page runs, and only the first writes or logs anything:
   - the daily: no params, on or after the epoch. Saves state, keeps a streak, logs anonymously.
   - preview (PRELAUNCH): before the epoch, no params. Plays No 1 as a no-write preview so
     testing today does not dirty the first day's numbers. Rolls over to the live daily at midnight.
   - practice (?practice): random boards on the live build with a Next button, writing nothing -
     a permanent way to test the game as shipped.
   - a pin (?board=N / ?day=N): one fixed board or day for testing, writing nothing. */
const PIN=(function(){ const b=/[?&]board=(\d+)/.exec(location.search), d=/[?&]day=(-?\d+)/.exec(location.search);
  if(b){ const v=parseInt(b[1],10); if(v>=1&&v<=L) return {kind:'board', dayNo:v, idx:v-1, label:'board '+v}; }
  if(d){ const v=parseInt(d[1],10); return {kind:'day', dayNo:v, idx:((v-1)%L+L)%L, label:'day '+v}; }
  return null; })();
const PRACTICE = !PIN && /[?&]practice/.test(location.search);
const rawDay = PIN ? PIN.dayNo : dayNumber();
const PRELAUNCH = !PIN && !PRACTICE && rawDay < 1;
const DAY_NO = PIN ? PIN.dayNo : (PRELAUNCH ? 1 : rawDay);   // preview shows No 1
const NOWRITE = !!PIN || PRACTICE || PRELAUNCH;              // only the real daily persists and logs

const KEY='heft', STORE_V=2;
/* The stored object carries a version. The schema will change - the Light rung will make two
   boards per day - and a change without a version to migrate from risks misreading or wiping a
   player's streak. A future build reads store.v and migrates; an object with no v is v1. */
function loadStore(){ try{ const o=JSON.parse(localStorage.getItem(KEY))||{};
  if((o.v||1) < 2){ delete o.day; delete o.cur; delete o.touches; delete o.done; }  // touches changed meaning (placements -> swaps) in 1.8.3; drop the stale in-progress board, keep the streak
  o.v=STORE_V; return o; }catch(e){ return {v:STORE_V}; } }
function saveStore(){ if(NOWRITE) return; try{ store.v=STORE_V; localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} }
let store=loadStore();

/* Anonymous, aggregate-only logging (1.7.8). Each event is sent at most once per day per device
   (a localStorage flag), carries no id and no IP - the server keeps counts, nothing more.
   Only heftdaily.com writes the live counts. Every other host - a branch preview, the vercel.app
   alias - writes the same events into the test namespace (1.8.4): a tester on a preview used to
   be invisible, and two of No 1's three finishers were exactly that. ?log=1 is the path probe:
   every event, no once-a-day flag, also into the test namespace. */
const LOG_LIVE = location.hostname==='heftdaily.com';
const LOG_PROBE = /[?&]log=1/.test(location.search);
const LOG_TEST = LOG_PROBE || !LOG_LIVE;
function logEvent(name, swaps){
  if(PIN || PRACTICE) return;
  if(PRELAUNCH && !LOG_PROBE) return;
  try{
    if(!LOG_PROBE){ let f=JSON.parse(localStorage.getItem('heftlog'))||{};
      if(f.day!==DAY_NO) f={day:DAY_NO};          // keep only the current day's flags - bounded
      if(f[name]) return; f[name]=1; localStorage.setItem('heftlog',JSON.stringify(f)); }
  }catch(e){}
  const body={day:DAY_NO, event:name};
  if(name==='solved') body.swaps=swaps;
  if(LOG_TEST) body.probe=1;
  try{ fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify(body),keepalive:true}).catch(function(){}); }catch(e){}
}

let day = PIN ? PIN.idx : PRACTICE ? randomBoard(-1) : ((DAY_NO-1)%L+L)%L,
    P, stocks, rackOrder, cur, touches, tilt, glow, depth=[], selected=null, ceilG=0, frozen=false;


/* wordmark: four letters hanging from the top edge of the header, which is the top of the
   page. Drawn 1:1 in CSS pixels - no scale factor sits between this drawing and the layout
   it has to meet, which is the boundary that produced every real bug in v1. The letters are
   centred in the header; the riser length is whatever is left over. The mark is positioned
   absolutely so it can never feed back into the height it is centring inside.
   The ink is measured with canvas measureText's actualBoundingBox*, which is the glyph's own
   outline. getBBox() on an SVG <text> was used until 1.6.2 and it returns the FONT's box -
   25.8px tall for a 19.4px face whose capitals are 14px - so the risers stopped 5px short of
   the letters for the whole of 1.4-1.6.1. A glyph sized from its box, again.
   Each riser stops where the ink starts on ITS OWN column (1.6.3): the H's cord comes down
   between the stems and meets the crossbar, where 1.6.2 left it hanging in the gap. */
(function(){
 const m=document.getElementById('mark'), hdr=document.querySelector('header');
 const F=22, S=F/19.4;                              // 1.6.2: up from 19.4, geometry scaled with it
 const W=Math.round(132*S), LX=[21.7,48.9,76.1,103.3].map(function(x){return x*S;});
 const FONT=F+'px "Archivo Black"';
 function ink(ch){                                  // the letter's own outline, not its box
   try{
     const c=document.createElement('canvas').getContext('2d');
     c.font=FONT; c.textAlign='center';
     const t=c.measureText(ch);
     if(!(t.actualBoundingBoxAscent>0)) throw 0;
     return {up:t.actualBoundingBoxAscent, down:t.actualBoundingBoxDescent,
             left:t.actualBoundingBoxLeft, right:t.actualBoundingBoxRight};
   }catch(e){ return {up:F*0.72, down:0, left:F*0.36, right:F*0.36}; }   // Archivo Black's ratios
 }
 function inkAtCentre(ch,up){
   // How far above the baseline the ink starts ON THE CORD'S OWN COLUMN. For E, F and T that
   // is the cap top; for the H the cord comes down between the stems and meets the crossbar.
   // Measured by drawing the letter and scanning the centre column - the thing itself.
   try{
     const k=4, cv=document.createElement('canvas'), c=cv.getContext('2d');
     cv.width=Math.ceil(F*k*2); cv.height=Math.ceil(F*k*2);
     c.font=(F*k)+'px "Archivo Black"'; c.textAlign='center'; c.fillStyle='#fff';
     const cx=cv.width/2, by=Math.round(F*k*1.2);
     c.fillText(ch,cx,by);
     const col=c.getImageData(Math.round(cx),0,1,cv.height).data;
     for(let y=0;y<cv.height;y++) if(col[y*4+3]>8) return (by-y)/k;
     throw 0;
   }catch(e){ return up; }
 }
 function lay(){
   const H=hdr.getBoundingClientRect().height;
   if(!(H>0)) return;
   const mid=(H-1)/2;                              // centre above the rule, not including it
   const I='HEFT'.split('').map(ink);
   const up=Math.max.apply(null,I.map(function(i){return i.up;}));
   const down=Math.max.apply(null,I.map(function(i){return i.down;}));
   const top=mid-(up+down)/2, base=top+up;          // ink centred: top gap equals bottom gap
   const dx=top-(LX[0]-I[0].left);                  // ...and the H's left gap is set to match them
   const meet='HEFT'.split('').map(function(ch,k){return base-inkAtCentre(ch,I[k].up);});
   m.setAttribute('viewBox','0 0 '+W+' '+H.toFixed(2));
   m.setAttribute('width',W); m.setAttribute('height',H.toFixed(2));
   m.innerHTML='<g class="risers" stroke="'+WIRE_B+'" fill="none" stroke-linecap="round" '
     +'stroke-width="'+sw(1.1)+'" stroke-opacity=".55">'
     +LX.map(function(x,k){return '<path d="M'+(x+dx).toFixed(2)+' 0V'+(meet[k]+1.5).toFixed(2)+'"/>';}).join('')+'</g>'
     +'<g class="ltrs">'+LX.map(function(x,k){return '<text class="ltr" x="'+(x+dx).toFixed(2)+'" y="'+base.toFixed(2)
       +'" text-anchor="middle" font-family="Archivo Black,serif" '
       +'font-size="'+F+'" fill="'+INK+'">'+'HEFT'[k]+'</text>';}).join('')+'</g>';
 }
 lay(); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(lay); setTimeout(lay,500);
 window.addEventListener('resize',lay);
})();

/* model */
function armList(n,out){ if(n.t==='a'){n._i=out.length;out.push(n);armList(n.l,out);armList(n.r,out);} return out; }
function massOf(n){ return n.t==='h' ? (cur[n.i]==null?0:P.vals[cur[n.i]]) : massOf(n.l)+massOf(n.r); }
function torques(n){ return [n.ld*massOf(n.l), n.rd*massOf(n.r)]; }
function hooksUnder(n){ return n.t==='h'?[n.i]:hooksUnder(n.l).concat(hooksUnder(n.r)); }
function full(n){ return hooksUnder(n).every(function(i){return cur[i]!=null;}); }
function balanced(n){ const t=torques(n); return full(n) && t[0]===t[1]; }
function subLevel(n){ return n.t==='h' ? cur[n.i]!=null : (balanced(n)&&subLevel(n.l)&&subLevel(n.r)); }
// a branch may only lock if its whole subtree has one possible filling — then level means proved
function boardProved(){ return cur.every(function(x){return x!=null;}) && P._arms.every(balanced); }
// a branch is proved by its own uniqueness, or by the whole board coming level
function settled(n){ return n.t==='h' ? cur[n.i]!=null : (subLevel(n) && (n.u===1 || boardProved())); }
function armLit(n){ return glow[n._i]; }
function lockedHooks(){ return new Set(); }
function litFor(i){
  let best=0;
  P._arms.forEach(function(n){ if(hooksUnder(n).indexOf(i)>=0) best=Math.max(best,glow[n._i]); });
  return best;

function mix(a,b,t){ const p=function(h){return [1,3,5].map(function(i){return parseInt(h.substr(i,2),16);});};

/* The saved state is a set of weights on hooks, and it only means anything on the board it was
   made on. Boards are chosen by day number, so regenerating the bank silently puts a different
   board under the same number - and a saved state restored onto it is wrong, possibly "solved".
   Each save carries a fingerprint of its board; on restore a mismatch drops the board and keeps
   the streak history. No fingerprint (a save from before 1.8.4) is accepted and stamped, so the
   change itself resets no one. Deferred from the 1.8.0 code review; built in 1.8.4. */
function sigOf(b){ const t=JSON.stringify(b,function(k,v){ return k.charAt(0)==='_'?undefined:v; });
  let h=5381; for(let i=0;i<t.length;i++) h=((h*33)^t.charCodeAt(i))>>>0; return h.toString(36); }
let boardSig='';
function load(){
  P=PUZZLES[day]; boardSig=sigOf(P); P._arms=armList(P.tree,[]);
  cur=new Array(P.nh).fill(null); touches=new Array(P.nh).fill(0); hitPts=[];
  tilt=P._arms.map(function(){return {cur:0,ph:Math.random()*6.28};});
  glow=P._arms.map(function(){return 0;}); ceilG=0;
  depth=[]; (function mk(n,dd){ if(n.t!=='a') return; depth[n._i]=dd; mk(n.l,dd+1); mk(n.r,dd+1); })(P.tree,0);
  /* Rank -> shape is fixed by apparent weight, and the rack is sorted to match: lightest on the
     left. Both were shuffled from 1.5.0 to 1.5.10 to close what looked like an information leak.
     It was not a leak, it was the vocabulary - with it gone every swap was a blind swap, and one
     step heavier stopped being a move you could make on purpose. The shapes now carry the order
     openly and by design, so position hides nothing by being scrambled; it only costs the player
     the reading of the row as a scale. */
  stocks=ORDERED.slice(0,P.k);
  rackOrder=stocks.map(function(_,i){return i;});
  selected=null; frozen=false;

  // restore the saved state for this day, or claim the day with a fresh board. The streak and
  // last-solved live in the same record and are carried across days untouched.
  if(!NOWRITE){
    if(store.day===DAY_NO && Array.isArray(store.cur) && store.cur.length===P.nh
       && (!store.sig || store.sig===boardSig)){    // same day, same board (or a pre-1.8.4 save)
      cur=store.cur.slice(); touches=(store.touches||cur.map(function(){return 0;})).slice();
      if(store.done){ frozen=true; }                 // a finished day comes back solved and frozen
      if(!store.sig){ store.sig=boardSig; saveStore(); }
    } else {
      store.day=DAY_NO; store.cur=cur.slice(); store.touches=touches.slice(); store.done=false; store.sig=boardSig;
      saveStore();
    }
  }

  document.getElementById('copy').style.display='none';
  document.getElementById('copy').textContent=shareLabel();
  document.getElementById('copy').classList.remove('go');
  logEvent('opened');
  buildRack(); fit(); message();
}

/* geometry */
function positions(t){
  const pos={};
  (function walk(n,px,py){
    if(n.t==='h'){ pos['h'+n.i]=[px,py+HOOKDROP]; return; }
    const th=tilt[n._i].cur;
    const c=Math.cos(th), sn=Math.sin(th);
    const lx=px-n.ld*U*c, ly=py-n.ld*U*sn, rx=px+n.rd*U*c, ry=py+n.rd*U*sn;
    pos['a'+n._i]={p:[px,py],l:[lx,ly],r:[rx,ry]};
    walk(n.l, lx, ly+DROP); walk(n.r, rx, ry+DROP);
  })(P.tree,0,0);
  return pos;
}
/* The scale is fixed for the whole board and the vertical box tracks the ink.
   k is pinned at load from the width and from the tallest the board can ever get, so
   nothing ever rescales mid-play and an arm's lean is the same size in pixels all game.
   Only the height of the box, and of the stage holding it, follows the tilting. */
let FRAME=null, lastH=-1;
const stageEl=document.querySelector('.stage');

// the lowest any hook can be driven, with every arm thrown as far down as it will go
function worstDrop(n,py){
  if(n.t==='h') return py+HOOKDROP;
  const s=Math.sin(MAX_TILT);
  return Math.max(worstDrop(n.l,py+n.ld*U*s+DROP), worstDrop(n.r,py+n.rd*U*s+DROP));
}
function fit(){
  const pos=positions(0); let x0=1e9,x1=-1e9;
  for(let i=0;i<P.nh;i++){const p=pos['h'+i];x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);}
  for(const k in pos) if(k[0]==='a'){const a=pos[k];x0=Math.min(x0,a.l[0]);x1=Math.max(x1,a.r[0]);}
  // round the box first, then derive k from the rounded numbers, so the scale is exact
  const pad=R+22, w=Math.round((x1-x0)+pad*2), hWorst=Math.ceil(worstDrop(P.tree,0)+R+44);
  stageEl.style.height='';                       // read the css height before overriding it
  const r=stageEl.getBoundingClientRect();
  FRAME={x:Math.round(x0-pad), w:w, hWorst:hWorst,
         k:(r.width>0&&r.height>0) ? Math.min(r.width/w, r.height/hWorst) : 0};
  lastH=-1; reframe(true);
}
// every frame: the box, never the scale
function reframe(force){
  if(!FRAME) return;
  const pos=positions(0); let y1=-1e9;
  for(let i=0;i<P.nh;i++) y1=Math.max(y1,pos['h'+i][1]);
  const h=Math.min(FRAME.hWorst, Math.ceil(y1+R+44));
  // the box and the stage move together or not at all: if they ever disagree the
  // drawing rescales, and a lean would change size for reasons that aren't its own
  // grow at once, shrink lazily: the box is never too small, only ever a pixel too generous
  if(!force && h<=lastH && (lastH-h)*(FRAME.k||1) <= 1) return;
  lastH=h;
  document.getElementById('board').setAttribute('viewBox',
    FRAME.x+' -44 '+FRAME.w+' '+h);
  if(FRAME.k>0) stageEl.style.height=(h*FRAME.k).toFixed(2)+'px';
}
window.addEventListener('resize',function(){ if(P) fit(); });

/* render */
const svg=document.getElementById('board'), NS='http://www.w3.org/2000/svg';
let hitPts=[];
function el(t,a){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;}
svg.appendChild((function(){const d=el('defs',{});
  const big=el('filter',{id:'bloom',x:'-90%',y:'-90%',width:'280%',height:'280%'});
  big.appendChild(el('feGaussianBlur',{stdDeviation:'4',result:'b'}));
  let m=el('feMerge',{});m.appendChild(el('feMergeNode',{in:'b'}));m.appendChild(el('feMergeNode',{in:'b'}));
  m.appendChild(el('feMergeNode',{in:'SourceGraphic'}));big.appendChild(m);d.appendChild(big);
  const sm=el('filter',{id:'warm',x:'-70%',y:'-70%',width:'240%',height:'240%'});
  sm.appendChild(el('feGaussianBlur',{stdDeviation:'1.9',result:'b'}));
  m=el('feMerge',{});m.appendChild(el('feMergeNode',{in:'b'}));m.appendChild(el('feMergeNode',{in:'SourceGraphic'}));
  sm.appendChild(m);d.appendChild(sm); return d;})());
const layer=el('g',{}); svg.appendChild(layer);

function nodes(key,col){
  const doc=new DOMParser().parseFromString(
    '<svg xmlns="http://www.w3.org/2000/svg"><path d="'+CELLS[key]+'" fill="'+col+'"/></svg>','image/svg+xml');
  return Array.prototype.slice.call(doc.documentElement.childNodes).map(function(n){return document.importNode(n,true);});
}
function droop(x1,y1,x2,y2,b){
  return 'M'+x1.toFixed(1)+' '+y1.toFixed(1)+' Q'+((x1+x2)/2).toFixed(1)+' '+((y1+y2)/2+b).toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1);
}

function draw(t){
  const pos=positions(t); layer.textContent='';
  const done=solved();                       // once per frame: the solved board labels every weight
  const rp=pos['a0'].p;
  // the box's top edge sits flush under the header, so the cord meets the header's rule
  // wherever the board's x=0 happens to fall — no pinning, no travel, nothing crossing to pixels
  const cordD='M0 -44V'+rp[1].toFixed(1);
  layer.appendChild(el('path',{d:cordD,stroke:WIRE_B,'stroke-width':sw(1.1),fill:'none',
    'stroke-opacity':'.55','stroke-linecap':'round'}));
  // the cord does not light. It did from 1.4.6 to 1.6.7 - or tried to: a vertical line has a
  // zero-width bounding box, and a filter sized from that box renders nothing (1.6.8).

  P._arms.forEach(function(n){
    const g=pos['a'+n._i], on=settled(n), gT=on?glow[n._i]:0;
    // bow scales with the arm, so a short arm is never more curved than it is tilted
    const armLen=(n.ld+n.rd)*U, bow=armLen*BOW_F;
    const cxA=(g.l[0]+g.r[0])/2, cyA=(g.l[1]+g.r[1])/2-2*bow;
    // the wire runs over a small pulley at each end, so the arm stops at the wheel's edge
    const adx=g.r[0]-g.l[0], ady=g.r[1]-g.l[1], alen=Math.hypot(adx,ady)||1;
    const ux=adx/alen, uy=ady/alen;

    const d='M'+aL[0].toFixed(1)+' '+aL[1].toFixed(1)
      +' Q'+cxA.toFixed(1)+' '+cyA.toFixed(1)+' '+aR[0].toFixed(1)+' '+aR[1].toFixed(1);
    const lev=balanced(n);
    layer.appendChild(el('path',{d,stroke:WIRE_B,'stroke-width':lev?sw(2.1):sw(1.6),fill:'none',
      'stroke-linecap':'round','stroke-opacity':lev?'1':'.7'}));
    /* The lit arm glows through the #warm blur, inside a group that has some height. A filter's
       region is sized from the bounding box of the thing it is applied to, and a level arm is a
       horizontal line with no height - so from 1.5.5 (straight arms; the bow had been giving the
       path its height) to 1.6.7 the region was empty and the glow vanished at the exact moment
       the arm settled. Two invisible ticks at the ends give the group 24 units of height and the
       region something to measure. Found by Dan on an iPad (1.6.8). */
    if(gT>0){
      const gl=el('g',{filter:'url(#bloom)'});          // the weights' glow, not the pulleys' (1.6.9)
      gl.appendChild(el('path',{d:'M'+aL[0].toFixed(1)+' '+(aL[1]-12).toFixed(1)+'V'+(aL[1]+12).toFixed(1)
        +'M'+aR[0].toFixed(1)+' '+(aR[1]-12).toFixed(1)+'V'+(aR[1]+12).toFixed(1),stroke:'none',fill:'none'}));
      gl.appendChild(el('path',{d,stroke:LIT,'stroke-width':'2.5',fill:'none','stroke-linecap':'round',
        pathLength:'1','stroke-dasharray':'1 1','stroke-dashoffset':(1-Math.min(1,gT*1.5)).toFixed(4)}));
      layer.appendChild(gl);
    }

    // control x is the chord midpoint, so x runs linearly along the curve
    const yAtX=function(X){
      const t=(X-g.l[0])/(g.r[0]-g.l[0]), u=1-t;
      return u*u*g.l[1] + 2*u*t*cyA + t*t*g.r[1];
    };
    layer.appendChild(el('circle',{cx:g.p[0].toFixed(1),cy:yAtX(g.p[0]).toFixed(1),r:(2.6*Math.sqrt(WS)).toFixed(2),
      fill:on?LIT:WIRE_B,'fill-opacity':on?(0.4+0.55*gT):'.9'}));
    ['l','r'].forEach(function(side){
      const units=side==='l'?n.ld:n.rd, end=g[side];
      for(let u2=1;u2<units;u2++){
        const X=g.p[0]+(end[0]-g.p[0])*(u2/units);
        layer.appendChild(el('circle',{cx:X.toFixed(1),cy:yAtX(X).toFixed(1),r:(1.8*Math.sqrt(WS)).toFixed(2),
          fill:on?LIT:WIRE_B,'fill-opacity':on?(0.3+0.65*gT):(lev?'.95':'.6')}));
      }
      const ch=side==='l'?n.l:n.r, cp=ch.t==='h'?pos['h'+ch.i]:pos['a'+ch._i].p;
      let stop=cp[1];

        stop = (t2==null) ? cp[1]-15.5                       // meets the empty socket
             : cp[1]-24*(S/48) + CELL_TOP[stocks[t2]]*(S/48); // meets the weight itself
      }
      layer.appendChild(el('path',{d:droop(end[0],end[1]+PUL,cp[0],stop,1.2),stroke:WIRE_B,'stroke-width':sw(1.2),
        fill:'none','stroke-opacity':'.65','stroke-linecap':'round'}));
      // the pulley itself: an outlined wheel with a hub, so it reads as hardware not as a weight
      layer.appendChild(el('circle',{cx:end[0].toFixed(1),cy:end[1].toFixed(1),r:PUL,fill:'none',
        stroke:on?LIT:WIRE_B,'stroke-width':sw(1.2),'stroke-opacity':on?(0.45+0.55*gT):'.7'}));
      layer.appendChild(el('circle',{cx:end[0].toFixed(1),cy:end[1].toFixed(1),r:(1.5*Math.sqrt(WS)).toFixed(2),
        fill:on?LIT:WIRE_B,'fill-opacity':on?(0.3+0.65*gT):(lev?'.95':'.6')}));

    if(type==null){

      g.appendChild(el('circle',{cx:p[0],cy:p[1],r:'15.5',fill:'none',
        stroke:armed?REST:WIRE_B,'stroke-width':armed?sw(1.5):sw(1.1),
        'stroke-opacity':armed?'.9':'.45',filter:armed?'url(#warm)':''}));

         the moment you lift a weight off - honest, because a full board is required to finish,
         so that re-hang is already owed. The same number rides on the weight once one is hung
         (below), so what is visible always sums to the swaps counter, and matches the
         end-of-game circles. Zero is dim; anything else ink. */
      const n=touches[i];
      const tx=el('text',{x:p[0],y:p[1],'text-anchor':'middle','dominant-baseline':'central',
        'font-family':'Karla,system-ui,sans-serif','font-size':'12.5','font-weight':'500',
        fill:n>0?INK:WIRE_B,'fill-opacity':n>0?'.9':'.5','pointer-events':'none',
        style:'font-variant-numeric:tabular-nums'});

    } else {
      const l=litFor(i), col=mix(REST,LIT,l), pop=1+0.15*Math.sin(l*Math.PI), sc=(S/48)*pop;
      const cg=el('g',{transform:'translate('+(p[0]-24*sc)+' '+(p[1]-24*sc)+') scale('+sc.toFixed(3)+')',

      g.appendChild(cg);

         by looking - which play found in the first days (1.8.5, restoring 1.8.2's badge on the
         1.8.3 count). During play only above zero, so a clean first fill puts no number on any
         weight. Once solved every weight shows its count, zero included and dim as in the
         sockets - a full board is the moment the counts become the scorecard, and the board then
         reads exactly as the share's circles do (1.8.6). */
      const sn=touches[i];
      if(sn>0 || done){
        const tx=el('text',{x:p[0],y:p[1],'text-anchor':'middle','dominant-baseline':'central',
          'font-family':'Karla,system-ui,sans-serif','font-size':'12.5','font-weight':'700',
          fill:'#161d4a','fill-opacity':sn>0?'1':'.5','pointer-events':'none',
          style:'font-variant-numeric:tabular-nums'});
        tx.textContent=String(sn);

    }

  }

/* The rule under the header is the mobile's ceiling, so it lights with the board - the same
   single honest signal, arriving at the point everything hangs from. Written only when it
   changes, not sixty times a second. */
const hdrEl=document.querySelector('header');
let ceilPainted=-1;
function paintCeiling(){
  if(ceilG===ceilPainted) return;
  if(ceilG>0 && ceilG<1 && Math.abs(ceilG-ceilPainted)<0.01) return;
  ceilPainted=ceilG;
  hdrEl.style.borderBottomColor = mix(mix('#161d4a',WIRE_B,0.5),LIT,ceilG);
  // a solid shadow thickens the rule downward to a level arm's stroke without shifting anything
  const grow=((2.1*WS-1)*ceilG).toFixed(2);
  hdrEl.style.boxShadow = ceilG>0
    ? '0 '+grow+'px 0 '+mix(mix('#161d4a',WIRE_B,0.5),LIT,ceilG)
      +', 0 '+grow+'px '+(14*ceilG).toFixed(1)+'px rgba(126,240,255,'+(0.30*ceilG).toFixed(3)+')' : '';
}
function frame(t){
  P._arms.forEach(function(n){
    const st=tilt[n._i], q=torques(n), l=q[0], r=q[1];
    const f=(l===0&&r===0)?0:(r-l)/(r+l);
    // the angle still says what the imbalance is; it no longer says it proportionally
    let mag=MAX_TILT*Math.pow(Math.abs(f),TILT_EXP);
    if(f!==0) mag=Math.max(mag,FLOOR_RAD);              // not level never draws level
    const target=Math.sign(f)*mag;
    st.cur += (target-st.cur)*0.1;
    if(Math.abs(target-st.cur)<0.0002) st.cur=target;   // settle exactly, don't creep forever
    glow[n._i] = boardProved() ? Math.min(1,glow[n._i]+0.05-depth[n._i]*0.006) : 0;
  });
  // the ceiling leads the root arm by a hair, since the glow spreads downward from it
  ceilG = boardProved() ? Math.min(1,ceilG+0.06) : 0;
  paintCeiling();
  reframe(false); draw(t); requestAnimationFrame(frame);
}

/* rack and play */
const rack=document.getElementById('rack'), promptEl=document.getElementById('prompt');
function used(t){ return cur.filter(function(x){return x===t;}).length; }
function buildRack(){
  rack.textContent='';
  rackOrder.forEach(function(type){
    const b=document.createElement('button'); b.className='stock';
    b.setAttribute('data-type',type);
    b.innerHTML='<svg viewBox="0 0 48 48"><path d="'+CELLS[stocks[type]]+'" fill="'+REST+'"/></svg>'
      +'<div class="allow">'+Array.from({length:P.cap},function(){return '<i></i>';}).join('')+'</div>';
    b.onclick=function(){selected=(selected===type)?null:type;syncRack();message();};
    rack.appendChild(b);
  });
  syncRack();
}
function syncRack(){
  Array.prototype.slice.call(rack.children).forEach(function(c,pos){
    const type=rackOrder[pos], u=used(type);
    Array.prototype.slice.call(c.querySelectorAll('.allow i')).forEach(function(d,j){d.classList.toggle('used',j<u);});
    c.classList.toggle('out',u>=P.cap);
    c.classList.toggle('on',selected===type&&u<P.cap);
  });
}
function tapHook(i){
  if(frozen) return;                                 // a solved daily is done for the day
  if(i<0||i>=P.nh) return;
  if(lockedHooks().has(i)) return;
  if(cur[i]!=null){ touches[i]++; cur[i]=null; selected=null; }   // taking a placed weight off is a swap: you must re-hang to finish, so it is already committed
  else if(selected!=null&&used(selected)<P.cap){ const wasEmpty=cur.every(function(x){return x==null;});
    cur[i]=selected; selected=null; if(wasEmpty) logEvent('first_hang'); }
  if(solved()) commitSolve(); else saveState();
  syncRack(); message();
}
/* Mid-board state is saved on every change, so a refresh restores the board rather than erasing
   the swaps and re-rolling the day. commitSolve runs once, when the board first comes level: it
   freezes the day, and advances the streak - up one if yesterday was solved, back to one if a
   day was missed. Neither consults the solution; both are facts about what the player did. */
/* Both writers re-read localStorage first and merge onto it, so a second tab whose in-memory
   copy predates the first tab's solve cannot clobber the streak/lastSolved/maxStreak/solved
   history (1.7.10). saveState never downgrades a day already solved on disk. */
function saveState(){ if(NOWRITE) return;
  const d=loadStore();
  if(d.done && d.day===DAY_NO) return;   // another tab already solved today; don't un-solve it
  d.day=DAY_NO; d.cur=cur.slice(); d.touches=touches.slice(); d.done=false; d.sig=boardSig;
  store=d; saveStore(); }
function commitSolve(){
  frozen = !PRACTICE;                    // practice stays editable so Clear/retry works; the daily freezes
  logEvent('solved', swaps());
  if(NOWRITE) return;
  const d=loadStore();                   // the authoritative streak lives on disk, not in a stale tab
  if(d.done && d.day===DAY_NO){ store=d; return; }
  const last=d.lastSolved||0;
  d.streak = (last===DAY_NO) ? (d.streak||1) : (last===DAY_NO-1 ? (d.streak||0)+1 : 1);
  d.lastSolved=DAY_NO; d.day=DAY_NO; d.done=true;
  d.cur=cur.slice(); d.touches=touches.slice(); d.sig=boardSig;
  // history that cannot be reconstructed if we start recording it later: the best streak ever,
  // and how many days have been solved. Kept even with nothing showing them yet (1.7.6).
  d.maxStreak=Math.max(d.maxStreak||0, d.streak);
  d.solved=(d.solved||0)+1;
  store=d; saveStore();
}
function streakNow(){ return NOWRITE ? 0 : (store.streak||0); }
// The score: swaps. A swap is a weight taken off a hook (counted on removal since 1.8.3 - a full
// board is needed to finish, so every removal is a committed re-hang). Called rehangs 1.4.7-1.6.6.
// touches[i] is this hook's swap count; the total is their sum. Exchanging two hung weights is two.
function swaps(){ return touches.reduce(function(s,n){return s+n;},0); }
function solved(){ return cur.every(function(x){return x!=null;}) && P._arms.every(balanced); }
const MON=['Jan','Feb','Mar','Apr','May','June','July','Aug','Sept','Oct','Nov','Dec'];
function stamp(){ const t=dateForDay(DAY_NO); return MON[t.getUTCMonth()]+' '+t.getUTCDate()+' • No '+DAY_NO; }
// one stat row: swaps, and the streak beside it. A solved card always has a streak of at least 1
// (solving today is a one-day streak), so it always shows; only a testing pin has none.
function scoreLine(){ const c=swaps(), k=streakNow(); return 'Swaps: '+c+(k>=1 ? ' \u2022 Streak: '+k : ''); }
function resultText(){ return '\u2696\ufe0f H E F T \u2696\ufe0f\n'+stamp()+'\n'+grid()+'\n'+scoreLine(); }
function shareText(){ return resultText()+'\nhttps://heftdaily.com'; }   // what leaves the page; the on-screen card has no link. With the scheme, Messages unfurls it into a preview card
function grid(){ return touches.map(function(c){
  return c===0?'🟢':c===1?'🟡':c===2?'🟠':'🔴';}).join(''); }
function message(){
  const done=solved(), c=swaps();
  // the same stamp and separator the shared result uses, so the header and the clipboard agree
  const cn = c>0 ? '<span style="color:var(--rest)">'+c+'</span>' : c;
  document.getElementById('meta').innerHTML=stamp()
    +'<br>'+cn+' swap'+(c===1?'':'s');   // hooks/weights line dropped (1.7.5): the rack and board show both
  promptEl.classList.toggle('win',done);
  if(!done){                                   // taking a weight back off retires the result
    const cb=document.getElementById('copy');
    cb.style.display='none'; cb.classList.remove('go'); cb.textContent=shareLabel();
  }
  if(done){
    promptEl.textContent = c===0?'Level, and not one swap.':'Level, with '+c+'.';
    promptEl.innerHTML=
      '<div class="stitle">\u2696\ufe0f H E F T \u2696\ufe0f</div>'+
      '<div class="sline">'+stamp()+'</div>'+
      '<div class="sgrid">'+grid()+'</div>'+
      '<div class="sline">'+scoreLine()+'</div>';
    if(!PRACTICE){                        // a practice result is a random board, not the daily - don't offer to share it
      document.getElementById('copy').style.display='';
      document.getElementById('copy').classList.add('go');
    }
  }
  else if(selected!=null) promptEl.textContent='Choose a hook to hang it on.';
  else if(cur.every(function(x){return x==null;})) promptEl.textContent='Fill the hooks so the whole mobile hangs level.';
  else {
    const lev=P._arms.filter(balanced).length;
    const allHung=cur.every(function(x){return x!=null;});
    if(allHung)     promptEl.textContent='Everything is hung, but it still leans.';
    else if(lev)    promptEl.textContent=lev+(lev===1?' arm hangs level.':' arms hang level.');
    else            promptEl.textContent='Tap anything hanging to take it back.';
  }
}
// fixed for the life of the page, so it is written once rather than on every tap
document.getElementById('build').textContent='build '+BUILD
  +(BUILD_OK?'':' \u00b7 BUILD MISMATCH')+(INK_F!==1?' \u00b7 ink '+INK_F:'')+(FLOOR_DEG!==1.25?' \u00b7 floor '+FLOOR_DEG:'')+(Math.abs(MAX_TILT-15*Math.PI/180)>1e-9?' \u00b7 tiltmax '+(MAX_TILT*180/Math.PI).toFixed(0):'')+(TILT_EXP!==1?' \u00b7 tilt '+TILT_EXP:'')+(GLYPHS!=='point'?' \u00b7 glyphs '+GLYPHS:'')
  +(BOW_F!==0?' \u00b7 bow '+BOW_F:'')+(PIN?' \u00b7 '+PIN.label:'')+(PRACTICE?' \u00b7 practice':'')+(PRELAUNCH?' \u00b7 preview':'');
document.getElementById('reset').onclick=function(){ if(frozen) return; var Lk=lockedHooks();
  for(var i=0;i<P.nh;i++) if(!Lk.has(i)) cur[i]=null;
  selected=null; saveState(); syncRack(); message();};
// "Another day" is gone: with a daily, a browse button would be a way off the day's board.
// If the tab is left open across midnight, the next look moves to the new day.
document.addEventListener('visibilitychange',function(){ if(!document.hidden && !PIN && !PRACTICE && dayNumber()!==rawDay) location.reload(); });
if(PRACTICE){ const nx=document.getElementById('next'); nx.style.display=''; nx.onclick=function(){ day=randomBoard(day); load(); }; }
/* Share opens the phone's share sheet with the card already in it - Messages, or anything
   else - which is as close as a page is allowed to get to "open Messages and paste". Where
   there is no sheet (desktop), the button copies instead. Same text either way (1.6.8). */
function shareLabel(){ return navigator.share ? 'Share' : 'Copy result'; }
document.getElementById('copy').onclick=function(){
  const cb=document.getElementById('copy');
  if(navigator.share){
    // the card goes to the clipboard too: Chrome on iOS has been seen handing Messages only the
    // page link, and a paste should work whatever the sheet did
    if(navigator.clipboard) navigator.clipboard.writeText(shareText()).catch(function(){});
    navigator.share({title:'HEFT',text:shareText()}).then(function(){ cb.textContent='Shared'; })
      .catch(function(){});                       // the sheet was dismissed; say nothing
  } else {
    if(navigator.clipboard) navigator.clipboard.writeText(shareText());
    cb.textContent='Copied';
  }};
function boardPoint(ev){
  const cx=('clientX' in ev)?ev.clientX:(ev.touches&&ev.touches[0]?ev.touches[0].clientX:0);
  const cy=('clientY' in ev)?ev.clientY:(ev.touches&&ev.touches[0]?ev.touches[0].clientY:0);
  const r=svg.getBoundingClientRect();
  const vb=(svg.getAttribute('viewBox')||'0 0 1 1').split(/[ ,]+/).map(Number);
  if(!r.width||!r.height) return [1e9,1e9];
  // the drawing is scaled to fit and centred inside the box; undo exactly that
  const k=Math.min(r.width/vb[2], r.height/vb[3]);
  const ox=(r.width - vb[2]*k)/2, oy=(r.height - vb[3]*k)/2;
  return [ vb[0] + (cx - r.left - ox)/k, vb[1] + (cy - r.top - oy)/k ];
}
function hitSlack(){
  const r=svg.getBoundingClientRect();
  const vb=(svg.getAttribute('viewBox')||'0 0 1 1').split(/[ ,]+/).map(Number);
  if(!r.width||!r.height) return R+6;
  const k=Math.min(r.width/vb[2], r.height/vb[3]);
  return Math.max(R+6, 24/k);            // never smaller than a fingertip
}
function hitHook(ev){
  const q=boardPoint(ev); let best=-1, bd=1e9;
  for(let i=0;i<P.nh;i++){                 // never past this board's hooks
    if(!hitPts[i]) continue;
    const d=Math.hypot(hitPts[i][0]-q[0], hitPts[i][1]-q[1]);
    if(d<bd){bd=d;best=i;}
  }
  return bd<=hitSlack() ? best : -1;
}
let downOn=-1, downAt=null;
svg.addEventListener('pointerdown',function(e){ downOn=hitHook(e); downAt=[e.clientX,e.clientY]; },{passive:true});
svg.addEventListener('pointerup',function(e){
  // the box can resize between down and up, so trust how far the finger moved, not a second hit test
  const moved=downAt?Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]):1e9;
  if(downOn>=0 && moved<14) tapHook(downOn);
  downOn=-1; downAt=null;
},{passive:true});
svg.addEventListener('pointercancel',function(){downOn=-1;downAt=null;});
document.addEventListener('touchstart',function(e){if(e.target.closest('#board'))e.preventDefault();},{passive:false});

load(); window.scrollTo(0,0); requestAnimationFrame(frame);
</script>
