<!DOCTYPE html>
<html lang="en" data-build="1.5.4">
<head>
<meta charset="utf-8">
<!-- Heft build 1.5.4 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Heft</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161d4a'/%3E%3Cpath d='M8 7H13.5V13.25H18.5V7H24V25H18.5V17.75H13.5V25H8Z' fill='%23dfe6ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--b1:#161d4a;--b2:#0a0e2c;--b3:#04050f;--wire:#4d59a6;--rest:#c98f4a;
        --lit:#7ef0ff;--ink:#dfe6ff;--dim:#6a74a8;--go:#6ee7a0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:var(--b3)}
  html,body{margin:0;overscroll-behavior:none;touch-action:manipulation}
  body{background:radial-gradient(120% 70% at 50% 0%,var(--b1) 0%,var(--b2) 46%,var(--b3) 100%);
       color:var(--ink);font-family:Karla,system-ui,sans-serif;display:flex;flex-direction:column;
       align-items:center;min-height:100svh;padding:0 12px calc(16px + env(safe-area-inset-bottom))}
  header{align-self:stretch;max-width:454px;margin:0 -12px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 12px 5px;border-bottom:1px solid rgba(77,89,166,.5);position:sticky;top:0;z-index:5;background:var(--b1)}
  #mark{position:absolute;left:12px;top:0;display:block;overflow:visible;pointer-events:none}
  .meta{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;line-height:1.2;padding-right:6px}
  .stage{width:100%;max-width:430px;height:48vh;height:48svh;display:flex;align-items:center;justify-content:center}
  #board{width:100%;height:100%;display:block;overflow:visible}
  /* the prompt hugs the board: same gap below the mobile whether it is one line or four */
  /* the block is centred, so its spare height splits evenly and the padding tips the
     balance: ~27px of air above the one-line message, ~17px below it */
  .prompt{font-size:13.5px;color:var(--dim);min-height:64px;padding:20px 8px 10px;margin:0;text-align:center;transition:color .35s;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* the result block is four lines and sits close under the mobile; give it room above */
  .prompt.win{color:var(--lit);padding-top:28px}
  .rack{display:flex;gap:14px;justify-content:center;align-items:flex-start;width:100%;max-width:430px}
  .stock{background:none;border:0;padding:4px;cursor:pointer;display:flex;flex-direction:column;
         align-items:center;gap:6px;transition:transform .18s cubic-bezier(.34,1.4,.5,1),opacity .25s}
  .stock svg{width:44px;height:44px;overflow:visible;display:block}
  .stock.on{transform:translateY(-8px)}
  .stock.out{opacity:.2;pointer-events:none}
  .allow{display:flex;gap:4px}
  .allow i{width:5px;height:5px;border-radius:50%;border:1px solid rgba(120,140,200,.55)}
  .allow i.used{background:var(--rest);border-color:var(--rest)}
  footer{margin-top:14px;display:flex;gap:8px}
  .btn{background:none;border:1px solid rgba(120,132,200,.3);color:var(--dim);font-family:inherit;
       font-size:12px;padding:7px 15px;border-radius:999px;cursor:pointer}
  .btn:active{color:var(--ink)}
  /* the result is ready to share; it says nothing about the puzzle that the glow hasn't */
  .btn.go{color:var(--go);border-color:rgba(110,231,160,.55);box-shadow:0 0 12px rgba(110,231,160,.18)}
  .btn.go:active{color:var(--ink)}
    .prompt .stitle{font-size:13px;letter-spacing:.14em;color:var(--ink);font-weight:500;line-height:1.5}
  .prompt .sline{font-size:13px;color:var(--dim);line-height:1.5}
  .prompt .sgrid{font-size:17px;letter-spacing:2px;margin-top:4px}
  .build{margin-top:12px;font-size:11px;color:var(--dim);opacity:.55;font-variant-numeric:tabular-nums}
  .hook{cursor:pointer}
</style>
</head>
<body>

<header>
  <svg id="mark" viewBox="0 0 340 74"></svg>
  <div class="meta" id="meta"></div>
</header>
<div class="stage"><svg id="board" aria-label="A hanging mobile"></svg></div>
<div class="prompt" id="prompt">Fill the hooks so the whole mobile hangs level.</div>
<div class="rack" id="rack"></div>
<footer>
  <button class="btn" id="reset">Clear</button>
  <button class="btn" id="next">Another day</button>
  <button class="btn" id="copy" style="display:none">Copy result</button>
</footer>
<div class="build" id="build"></div>

<script src="boards.js"></script>
<script>
const BUILD='1.5.4';
/* the build string sits in three places so it can be read without running the page: here,
   an html attribute, and a comment in the head. Three copies can disagree, so they are
   checked against each other - a number that lies is worse than one that is hard to read. */
const BUILD_OK=(function(){ let c=null;
  [].slice.call(document.head.childNodes).forEach(function(n){
    if(n.nodeType===8){ const x=/Heft build (\S+)/.exec(n.nodeValue||''); if(x) c=x[1]; } });
  return document.documentElement.getAttribute('data-build')===BUILD && c===BUILD; })();
const WIRE='#4d59a6', REST='#c98f4a', LIT='#7ef0ff', INK='#dfe6ff';
const CELLS={
 pent:'M24 8.5 38.7 19.2 33.1 36.5H14.9L9.3 19.2z',
 star:'M24 8L28.7 17.5L39.2 19.1L31.6 26.5L33.4 36.9L24 32L14.6 36.9L16.4 26.5L8.8 19.1L19.3 17.5z',
 prism:'M24 9.4 39.6 37.8H8.4z',
 diamond:'M24 8.6 39.4 24 24 39.4 8.6 24z'
};
const KEYS=Object.keys(CELLS);
// No weight is a circle any more: the ring was dropped in 1.5.2 because an empty socket is a
// circle too, and that ambiguity was a known untested risk. The star is a five-pointer at 30.4
// units of ink, in line with the other three, replacing an eight-pointed burst at 35.8.
// 'crescent' was in this set and drew nothing: its two arcs coincided, so it enclosed zero
// area. It never reached a screen before 1.5.0 - the old shape formula always collided and fell
// back to the first four keys - so the bank's shape variety was illusory. Removed, not repaired.
const CELL_TOP={pent:8.5, star:8, prism:9.4, diamond:8.6};
const U=22, DROP=56, HOOKDROP=30, BOW=4, R=21, S=44;
/* The tilt range. 15 was the shipped value; 30 was measured and rejected as a staircase.
   Widening is the only lever that reduces invisible single-weight swaps (40.6% at 15 deg,
   34.6% at 20), but it costs vertical envelope, so the pinned scale shrinks a little. */
const MAX_TILT=(function(){ const m=/[?&]tiltmax=([\d.]+)/.exec(location.search);
  const v=m?parseFloat(m[1]):15; return ((v>=8&&v<=30)?v:15)*Math.PI/180; })();

/* The angle is proportional to the fractional torque imbalance: the tilt is the arithmetic.
   ?tilt=N raises it to a power instead, which lifts small imbalances out of the sub-pixel
   band at the cost of compressing everything above a quarter off. 1 is proportional. */
/* The smallest lean the drawing is allowed to show for an arm that is not level, in DEGREES.
   Pixels were the wrong unit: two boards whose arms differ 2.6x in length both became readable
   at about 1.1-1.2 deg, because the eye judges an arm's slope against the risers and arms
   around it, and that comparison is angular. 0 restores 1.5.2. */
const FLOOR_DEG=(function(){ const m=/[?&]floor=([\d.]+)/.exec(location.search);
  const v=m?parseFloat(m[1]):1.25; return (v>=0&&v<=6)?v:1.25; })();
const FLOOR_RAD=FLOOR_DEG*Math.PI/180;
const TILT_EXP=(function(){ const m=/[?&]tilt=([\d.]+)/.exec(location.search);
  const v=m?parseFloat(m[1]):1; return (v>0&&v<=1)?v:1; })();

/* The bow is a constant: sag is BOW_F of the arm's length whatever the state, so it carries
   nothing and simply sits on top of the lean. ?bow=0 straightens the arms for comparison. */
const BOW_F=(function(){ const m=/[?&]bow=([\d.]+)/.exec(location.search);
  const v=m?parseFloat(m[1]):0.025; return (v>=0&&v<=0.2)?v:0.025; })();

/* How much the wire is lifted off the background. Brightness and stroke weight only - no
   opacity is touched, because opacity carries real signals here (a level arm draws at full
   stroke and full opacity, a leaning one does not) and lifting it would flatten them.
   ?ink=0 is exactly the 1.4.7 drawing; 1 is the default; 2 is as far as it goes. */
const INK_F=(function(){ const m=/[?&]ink=([\d.]+)/.exec(location.search);
  const v=m?parseFloat(m[1]):1; return (v>=0&&v<=2)?v:1; })();
const WIRE_B=mix(WIRE,INK,0.28*INK_F);
const WS=1+0.20*INK_F;                            // stroke width scale
function sw(base){ return (base*WS).toFixed(2); }

/* Boards are drawn at random for now; ordering waits for the daily. ?board=N pins one,
   so a link can still point at a specific puzzle. */
function randomBoard(not){
  if(PUZZLES.length<2) return 0;
  let n; do{ n=Math.floor(Math.random()*PUZZLES.length); }while(n===not);
  return n;
}
const BOARD0=(function(){ const m=/[?&]board=(\d+)/.exec(location.search);
  const v=m?parseInt(m[1],10):0;
  return (v>=1&&v<=PUZZLES.length) ? v-1 : randomBoard(-1); })();

let day=BOARD0, P, stocks, rackOrder, cur, touches, tilt, glow, depth=[], selected=null, ceilG=0;

/* Shapes and rack positions are shuffled per board, seeded from the board index - so they are
   the same for everyone on the same board, and a shuffle rather than a rotation. Position must
   carry nothing: the rack used to render lightest-to-heaviest on all 144 boards, which handed
   over the full ranking of the four weights in a game whose premise is that you never learn
   what anything weighs. */
function rng(seed){ let s=(seed>>>0)||1;
  return function(){ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function shuffled(arr,rand){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; }
  return a; }

/* wordmark: four letters hanging from the top edge of the header, which is the top of the
   page. Drawn 1:1 in CSS pixels - no scale factor sits between this drawing and the layout
   it has to meet, which is the boundary that produced every real bug in v1. The letters are
   centred in the header; the riser length is whatever is left over. The mark is positioned
   absolutely so it can never feed back into the height it is centring inside. */
(function(){
 const m=document.getElementById('mark'), hdr=document.querySelector('header');
 const W=132, F=19.4, LX=[21.7,48.9,76.1,103.3];   // 132/340 of the old 340-unit drawing
 function lay(){
   const H=hdr.getBoundingClientRect().height;
   if(!(H>0)) return;
   const mid=(H-1)/2;                              // centre above the rule, not including it
   m.setAttribute('viewBox','0 0 '+W+' '+H.toFixed(2));
   m.setAttribute('width',W); m.setAttribute('height',H.toFixed(2));
   m.innerHTML='<g class="risers" stroke="'+WIRE_B+'" fill="none" stroke-linecap="round" '
     +'stroke-width="'+sw(1.1)+'" stroke-opacity=".55">'+LX.map(function(){return '<path/>';}).join('')+'</g>'
     +'<g class="ltrs">'+LX.map(function(x,k){return '<text class="ltr" x="'+x+'" y="'+mid.toFixed(2)
       +'" text-anchor="middle" dominant-baseline="central" font-family="Archivo Black,serif" '
       +'font-size="'+F+'" fill="'+INK+'">'+'HEFT'[k]+'</text>';}).join('')+'</g>';
   // measure the ink, never the text box - a glyph sized from its box cost v1 real time
   const l=[].slice.call(m.querySelectorAll('.ltr'));
   let dy=0, dx=0, top=mid-F*0.36;                 // fallback: central baseline, half a cap up
   try{
     let y0=1e9,y1=-1e9,x0=1e9;
     l.forEach(function(t){ const b=t.getBBox(); if(!(b.height>0)) throw 0;
       y0=Math.min(y0,b.y); y1=Math.max(y1,b.y+b.height); x0=Math.min(x0,b.x); });
     dy=mid-(y0+y1)/2; top=y0+dy;                  // top gap and bottom gap are equal by centring
     dx=top-x0;                                    // ...and the left gap is set to match them
   }catch(e){}
   l.forEach(function(t,i){ t.setAttribute('x',(LX[i]+dx).toFixed(2));
                            t.setAttribute('y',(mid+dy).toFixed(2)); });
   [].slice.call(m.querySelectorAll('.risers path')).forEach(function(p,i){
     p.setAttribute('d','M'+(LX[i]+dx).toFixed(2)+' 0V'+(top+1.5).toFixed(2)); });
 }
 lay(); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(lay); setTimeout(lay,500);
 window.addEventListener('resize',lay);
})();

/* model */
function armList(n,out){ if(n.t==='a'){n._i=out.length;out.push(n);armList(n.l,out);armList(n.r,out);} return out; }
function massOf(n){ return n.t==='h' ? (cur[n.i]==null?0:P.vals[cur[n.i]]) : massOf(n.l)+massOf(n.r); }
function torques(n){ return [n.ld*massOf(n.l), n.rd*massOf(n.r)]; }
function hooksUnder(n){ return n.t==='h'?[n.i]:hooksUnder(n.l).concat(hooksUnder(n.r)); }
function full(n){ return hooksUnder(n).every(function(i){return cur[i]!=null;}); }
function balanced(n){ const t=torques(n); return full(n) && t[0]===t[1]; }
function subLevel(n){ return n.t==='h' ? cur[n.i]!=null : (balanced(n)&&subLevel(n.l)&&subLevel(n.r)); }
// a branch may only lock if its whole subtree has one possible filling — then level means proved
function boardProved(){ return cur.every(function(x){return x!=null;}) && P._arms.every(balanced); }
// a branch is proved by its own uniqueness, or by the whole board coming level
function settled(n){ return n.t==='h' ? cur[n.i]!=null : (subLevel(n) && (n.u===1 || boardProved())); }
function armLit(n){ return glow[n._i]; }
function lockedHooks(){ return new Set(); }
function litFor(i){
  let best=0;
  P._arms.forEach(function(n){ if(hooksUnder(n).indexOf(i)>=0) best=Math.max(best,glow[n._i]); });
  return best;
}
function mix(a,b,t){ const p=function(h){return [1,3,5].map(function(i){return parseInt(h.substr(i,2),16);});};
  const A=p(a),B=p(b); return '#'+A.map(function(v,i){return Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0');}).join(''); }

function load(){
  P=PUZZLES[day]; P._arms=armList(P.tree,[]);
  cur=new Array(P.nh).fill(null); touches=new Array(P.nh).fill(0); hitPts=[];
  tilt=P._arms.map(function(){return {cur:0,ph:Math.random()*6.28};});
  glow=P._arms.map(function(){return 0;}); ceilG=0;
  depth=[]; (function mk(n,dd){ if(n.t!=='a') return; depth[n._i]=dd; mk(n.l,dd+1); mk(n.r,dd+1); })(P.tree,0);
  const rand=rng((day+1)*2654435761);
  stocks=shuffled(KEYS,rand).slice(0,P.k);          // distinct by construction
  rackOrder=shuffled(stocks.map(function(_,i){return i;}),rand);
  selected=null;

  document.getElementById('copy').style.display='none';
  document.getElementById('copy').textContent='Copy result';
  document.getElementById('copy').classList.remove('go');
  buildRack(); fit(); message();
}

/* geometry */
function positions(t){
  const pos={};
  (function walk(n,px,py){
    if(n.t==='h'){ pos['h'+n.i]=[px,py+HOOKDROP]; return; }
    const th=tilt[n._i].cur;
    const c=Math.cos(th), sn=Math.sin(th);
    const lx=px-n.ld*U*c, ly=py-n.ld*U*sn, rx=px+n.rd*U*c, ry=py+n.rd*U*sn;
    pos['a'+n._i]={p:[px,py],l:[lx,ly],r:[rx,ry]};
    walk(n.l, lx, ly+DROP); walk(n.r, rx, ry+DROP);
  })(P.tree,0,0);
  return pos;
}
/* The scale is fixed for the whole board and the vertical box tracks the ink.
   k is pinned at load from the width and from the tallest the board can ever get, so
   nothing ever rescales mid-play and an arm's lean is the same size in pixels all game.
   Only the height of the box, and of the stage holding it, follows the tilting. */
let FRAME=null, lastH=-1;
const stageEl=document.querySelector('.stage');

// the lowest any hook can be driven, with every arm thrown as far down as it will go
function worstDrop(n,py){
  if(n.t==='h') return py+HOOKDROP;
  const s=Math.sin(MAX_TILT);
  return Math.max(worstDrop(n.l,py+n.ld*U*s+DROP), worstDrop(n.r,py+n.rd*U*s+DROP));
}
function fit(){
  const pos=positions(0); let x0=1e9,x1=-1e9;
  for(let i=0;i<P.nh;i++){const p=pos['h'+i];x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);}
  for(const k in pos) if(k[0]==='a'){const a=pos[k];x0=Math.min(x0,a.l[0]);x1=Math.max(x1,a.r[0]);}
  // round the box first, then derive k from the rounded numbers, so the scale is exact
  const pad=R+22, w=Math.round((x1-x0)+pad*2), hWorst=Math.ceil(worstDrop(P.tree,0)+R+44);
  stageEl.style.height='';                       // read the css height before overriding it
  const r=stageEl.getBoundingClientRect();
  FRAME={x:Math.round(x0-pad), w:w, hWorst:hWorst,
         k:(r.width>0&&r.height>0) ? Math.min(r.width/w, r.height/hWorst) : 0};
  lastH=-1; reframe(true);
}
// every frame: the box, never the scale
function reframe(force){
  if(!FRAME) return;
  const pos=positions(0); let y1=-1e9;
  for(let i=0;i<P.nh;i++) y1=Math.max(y1,pos['h'+i][1]);
  const h=Math.min(FRAME.hWorst, Math.ceil(y1+R+44));
  // the box and the stage move together or not at all: if they ever disagree the
  // drawing rescales, and a lean would change size for reasons that aren't its own
  // grow at once, shrink lazily: the box is never too small, only ever a pixel too generous
  if(!force && h<=lastH && (lastH-h)*(FRAME.k||1) <= 1) return;
  lastH=h;
  document.getElementById('board').setAttribute('viewBox',
    FRAME.x+' -44 '+FRAME.w+' '+h);
  if(FRAME.k>0) stageEl.style.height=(h*FRAME.k).toFixed(2)+'px';
}
window.addEventListener('resize',function(){ if(P) fit(); });

/* render */
const svg=document.getElementById('board'), NS='http://www.w3.org/2000/svg';
let hitPts=[];
function el(t,a){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;}
svg.appendChild((function(){const d=el('defs',{});
  const big=el('filter',{id:'bloom',x:'-90%',y:'-90%',width:'280%',height:'280%'});
  big.appendChild(el('feGaussianBlur',{stdDeviation:'4',result:'b'}));
  let m=el('feMerge',{});m.appendChild(el('feMergeNode',{in:'b'}));m.appendChild(el('feMergeNode',{in:'b'}));
  m.appendChild(el('feMergeNode',{in:'SourceGraphic'}));big.appendChild(m);d.appendChild(big);
  const sm=el('filter',{id:'warm',x:'-70%',y:'-70%',width:'240%',height:'240%'});
  sm.appendChild(el('feGaussianBlur',{stdDeviation:'1.9',result:'b'}));
  m=el('feMerge',{});m.appendChild(el('feMergeNode',{in:'b'}));m.appendChild(el('feMergeNode',{in:'SourceGraphic'}));
  sm.appendChild(m);d.appendChild(sm); return d;})());
const layer=el('g',{}); svg.appendChild(layer);

function nodes(key,col){
  const doc=new DOMParser().parseFromString(
    '<svg xmlns="http://www.w3.org/2000/svg"><path d="'+CELLS[key]+'" fill="'+col+'"/></svg>','image/svg+xml');
  return Array.prototype.slice.call(doc.documentElement.childNodes).map(function(n){return document.importNode(n,true);});
}
function droop(x1,y1,x2,y2,b){
  return 'M'+x1.toFixed(1)+' '+y1.toFixed(1)+' Q'+((x1+x2)/2).toFixed(1)+' '+((y1+y2)/2+b).toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1);
}

function draw(t){
  const pos=positions(t); layer.textContent='';
  const rp=pos['a0'].p;
  // the box's top edge sits flush under the header, so the cord meets the header's rule
  // wherever the board's x=0 happens to fall — no pinning, no travel, nothing crossing to pixels
  const cordD='M0 -44V'+rp[1].toFixed(1);
  layer.appendChild(el('path',{d:cordD,stroke:WIRE_B,'stroke-width':sw(1.1),fill:'none',
    'stroke-opacity':'.55','stroke-linecap':'round'}));
  // the cord lights from the top down, or the lit ceiling would sit above a dark gap
  if(ceilG>0) layer.appendChild(el('path',{d:cordD,stroke:LIT,'stroke-width':'1.5',fill:'none',
    'stroke-linecap':'round',filter:'url(#warm)',pathLength:'1','stroke-dasharray':'1 1',
    'stroke-dashoffset':(1-Math.min(1,ceilG*1.5)).toFixed(4)}));

  P._arms.forEach(function(n){
    const g=pos['a'+n._i], on=settled(n), gT=on?glow[n._i]:0;
    // bow scales with the arm, so a short arm is never more curved than it is tilted
    const armLen=(n.ld+n.rd)*U, bow=armLen*BOW_F;
    const cxA=(g.l[0]+g.r[0])/2, cyA=(g.l[1]+g.r[1])/2-2*bow;
    const d='M'+g.l[0].toFixed(1)+' '+g.l[1].toFixed(1)
      +' Q'+cxA.toFixed(1)+' '+cyA.toFixed(1)+' '+g.r[0].toFixed(1)+' '+g.r[1].toFixed(1);
    const lev=balanced(n);
    layer.appendChild(el('path',{d,stroke:WIRE_B,'stroke-width':lev?sw(2.1):sw(1.6),fill:'none',
      'stroke-linecap':'round','stroke-opacity':lev?'1':'.7'}));
    if(gT>0) layer.appendChild(el('path',{d,stroke:LIT,'stroke-width':'2.5',fill:'none','stroke-linecap':'round',
      filter:'url(#warm)',pathLength:'1','stroke-dasharray':'1 1','stroke-dashoffset':(1-Math.min(1,gT*1.5)).toFixed(4)}));

    // control x is the chord midpoint, so x runs linearly along the curve
    const yAtX=function(X){
      const t=(X-g.l[0])/(g.r[0]-g.l[0]), u=1-t;
      return u*u*g.l[1] + 2*u*t*cyA + t*t*g.r[1];
    };
    layer.appendChild(el('circle',{cx:g.p[0].toFixed(1),cy:yAtX(g.p[0]).toFixed(1),r:(2.6*Math.sqrt(WS)).toFixed(2),
      fill:on?LIT:WIRE_B,'fill-opacity':on?(0.4+0.55*gT):'.9'}));
    ['l','r'].forEach(function(side){
      const units=side==='l'?n.ld:n.rd, end=g[side];
      for(let u2=1;u2<=units;u2++){
        const X=g.p[0]+(end[0]-g.p[0])*(u2/units);
        layer.appendChild(el('circle',{cx:X.toFixed(1),cy:yAtX(X).toFixed(1),r:(1.8*Math.sqrt(WS)).toFixed(2),
          fill:on?LIT:WIRE_B,'fill-opacity':on?(0.3+0.65*gT):(lev?'.95':'.6')}));
      }
      const ch=side==='l'?n.l:n.r, cp=ch.t==='h'?pos['h'+ch.i]:pos['a'+ch._i].p;
      let stop=cp[1];
      if(ch.t==='h'){
        const t2=cur[ch.i];
        stop = (t2==null) ? cp[1]-15.5                       // meets the empty socket
             : cp[1]-24*(S/48) + CELL_TOP[stocks[t2]]*(S/48); // meets the weight itself
      }
      layer.appendChild(el('path',{d:droop(end[0],end[1],cp[0],stop,1.2),stroke:WIRE_B,'stroke-width':sw(1.2),
        fill:'none','stroke-opacity':'.65','stroke-linecap':'round'}));
    });
  });

  for(let i=0;i<P.nh;i++){
    const p=pos['h'+i], type=cur[i], g=el('g',{class:'hook'});
    g.setAttribute('data-h',i);
    hitPts[i]=p;                       // remembered for delegated hit-testing
    g.appendChild(el('circle',{cx:p[0],cy:p[1],r:R,fill:'transparent'}));
    if(type==null){
      const armed=selected!=null;
      if(armed) g.appendChild(el('circle',{cx:p[0],cy:p[1],r:'15.5',fill:REST,'fill-opacity':'.10'}));
      g.appendChild(el('circle',{cx:p[0],cy:p[1],r:'15.5',fill:'none',
        stroke:armed?REST:WIRE_B,'stroke-width':armed?sw(1.5):sw(1.1),
        'stroke-opacity':armed?'.9':'.45',filter:armed?'url(#warm)':''}));
    } else {
      const l=litFor(i), col=mix(REST,LIT,l), pop=1+0.15*Math.sin(l*Math.PI), sc=(S/48)*pop;
      const cg=el('g',{transform:'translate('+(p[0]-24*sc)+' '+(p[1]-24*sc)+') scale('+sc.toFixed(3)+')',
                       filter:l>0.05?'url(#bloom)':'url(#warm)'});
      nodes(stocks[type],col).forEach(function(x){cg.appendChild(x);});
      g.appendChild(cg);
    }
    layer.appendChild(g);
  }
}

/* The rule under the header is the mobile's ceiling, so it lights with the board - the same
   single honest signal, arriving at the point everything hangs from. Written only when it
   changes, not sixty times a second. */
const hdrEl=document.querySelector('header');
let ceilPainted=-1;
function paintCeiling(){
  if(ceilG===ceilPainted) return;
  if(ceilG>0 && ceilG<1 && Math.abs(ceilG-ceilPainted)<0.01) return;
  ceilPainted=ceilG;
  hdrEl.style.borderBottomColor = mix(mix('#161d4a',WIRE_B,0.5),LIT,ceilG);
  // a solid shadow thickens the rule downward to a level arm's stroke without shifting anything
  const grow=((2.1*WS-1)*ceilG).toFixed(2);
  hdrEl.style.boxShadow = ceilG>0
    ? '0 '+grow+'px 0 '+mix(mix('#161d4a',WIRE_B,0.5),LIT,ceilG)
      +', 0 '+grow+'px '+(14*ceilG).toFixed(1)+'px rgba(126,240,255,'+(0.30*ceilG).toFixed(3)+')' : '';
}
function frame(t){
  P._arms.forEach(function(n){
    const st=tilt[n._i], q=torques(n), l=q[0], r=q[1];
    const f=(l===0&&r===0)?0:(r-l)/(r+l);
    // the angle still says what the imbalance is; it no longer says it proportionally
    let mag=MAX_TILT*Math.pow(Math.abs(f),TILT_EXP);
    if(f!==0) mag=Math.max(mag,FLOOR_RAD);              // not level never draws level
    const target=Math.sign(f)*mag;
    st.cur += (target-st.cur)*0.1;
    if(Math.abs(target-st.cur)<0.0002) st.cur=target;   // settle exactly, don't creep forever
    glow[n._i] = boardProved() ? Math.min(1,glow[n._i]+0.05-depth[n._i]*0.006) : 0;
  });
  // the ceiling leads the root arm by a hair, since the glow spreads downward from it
  ceilG = boardProved() ? Math.min(1,ceilG+0.06) : 0;
  paintCeiling();
  reframe(false); draw(t); requestAnimationFrame(frame);
}

/* rack and play */
const rack=document.getElementById('rack'), promptEl=document.getElementById('prompt');
function used(t){ return cur.filter(function(x){return x===t;}).length; }
function buildRack(){
  rack.textContent='';
  rackOrder.forEach(function(type){
    const b=document.createElement('button'); b.className='stock';
    b.setAttribute('data-type',type);
    b.innerHTML='<svg viewBox="0 0 48 48"><path d="'+CELLS[stocks[type]]+'" fill="'+REST+'"/></svg>'
      +'<div class="allow">'+Array.from({length:P.cap},function(){return '<i></i>';}).join('')+'</div>';
    b.onclick=function(){selected=(selected===type)?null:type;syncRack();message();};
    rack.appendChild(b);
  });
  syncRack();
}
function syncRack(){
  Array.prototype.slice.call(rack.children).forEach(function(c,pos){
    const type=rackOrder[pos], u=used(type);
    Array.prototype.slice.call(c.querySelectorAll('.allow i')).forEach(function(d,j){d.classList.toggle('used',j<u);});
    c.classList.toggle('out',u>=P.cap);
    c.classList.toggle('on',selected===type&&u<P.cap);
  });
}
function tapHook(i){
  if(i<0||i>=P.nh) return;
  if(lockedHooks().has(i)) return;
  if(cur[i]!=null){ cur[i]=null; selected=null; }
  else if(selected!=null&&used(selected)<P.cap){ cur[i]=selected; touches[i]++; selected=null; }
  syncRack(); message();
}
function rehangs(){ return touches.reduce(function(s,n){return s+Math.max(0,n-1);},0); }
function solved(){ return cur.every(function(x){return x!=null;}) && P._arms.every(balanced); }
const MON=['Jan','Feb','Mar','Apr','May','June','July','Aug','Sept','Oct','Nov','Dec'];
function stamp(){ const t=new Date(); return 'No '+(day+1)+' • '+MON[t.getMonth()]+' '+t.getDate(); }
function scoreLine(){ const c=rehangs(); return c+' Rehang'+(c===1?'':'s'); }
function resultText(){ return '\u2696\ufe0f H E F T \u2696\ufe0f\n'+stamp()+'\n'+grid()+'\n'+scoreLine(); }
function grid(){ return touches.map(function(n){const c=Math.max(0,n-1);
  return c===0?'🟢':c===1?'🟡':c===2?'🟠':'🔴';}).join(''); }
function message(){
  const done=solved(), c=rehangs();
  // the same stamp and separator the shared result uses, so the header and the clipboard agree
  const cn = c>0 ? '<span style="color:var(--rest)">'+c+'</span>' : c;
  document.getElementById('meta').innerHTML=stamp()
    +'<br>'+P.nh+' hooks \u2022 '+P.k+' weights'
    +'<br>'+cn+' rehang'+(c===1?'':'s');
  promptEl.classList.toggle('win',done);
  if(!done){                                   // taking a weight back off retires the result
    const cb=document.getElementById('copy');
    cb.style.display='none'; cb.classList.remove('go'); cb.textContent='Copy result';
  }
  if(done){
    promptEl.textContent = c===0?'Level, and not one rehang.':'Level, with '+c+'.';
    promptEl.innerHTML=
      '<div class="stitle">\u2696\ufe0f H E F T \u2696\ufe0f</div>'+
      '<div class="sline">'+stamp()+'</div>'+
      '<div class="sgrid">'+grid()+'</div>'+
      '<div class="sline">'+scoreLine()+'</div>';
    document.getElementById('copy').style.display='';
    document.getElementById('copy').classList.add('go');
  }
  else if(selected!=null) promptEl.textContent='Choose a hook to hang it on.';
  else if(cur.every(function(x){return x==null;})) promptEl.textContent='Fill the hooks so the whole mobile hangs level.';
  else {
    const lev=P._arms.filter(balanced).length;
    const allHung=cur.every(function(x){return x!=null;});
    if(allHung)     promptEl.textContent='Everything is hung, but it still leans.';
    else if(lev)    promptEl.textContent=lev+(lev===1?' arm hangs level.':' arms hang level.');
    else            promptEl.textContent='Tap anything hanging to take it back.';
  }
}
// fixed for the life of the page, so it is written once rather than on every tap
document.getElementById('build').textContent='build '+BUILD
  +(BUILD_OK?'':' \u00b7 BUILD MISMATCH')+(INK_F!==1?' \u00b7 ink '+INK_F:'')+(FLOOR_DEG!==1.25?' \u00b7 floor '+FLOOR_DEG:'')+(Math.abs(MAX_TILT-15*Math.PI/180)>1e-9?' \u00b7 tiltmax '+(MAX_TILT*180/Math.PI).toFixed(0):'')+(TILT_EXP!==1?' \u00b7 tilt '+TILT_EXP:'')
  +(BOW_F!==0.025?' \u00b7 bow '+BOW_F:'');
document.getElementById('reset').onclick=function(){var L=lockedHooks();
  for(var i=0;i<P.nh;i++) if(!L.has(i)) cur[i]=null;
  selected=null;syncRack();message();};
document.getElementById('next').onclick=function(){day=randomBoard(day);load();};
document.getElementById('copy').onclick=function(){
  if(navigator.clipboard) navigator.clipboard.writeText(resultText());
  document.getElementById('copy').textContent='Copied';};
function boardPoint(ev){
  const cx=('clientX' in ev)?ev.clientX:(ev.touches&&ev.touches[0]?ev.touches[0].clientX:0);
  const cy=('clientY' in ev)?ev.clientY:(ev.touches&&ev.touches[0]?ev.touches[0].clientY:0);
  const r=svg.getBoundingClientRect();
  const vb=(svg.getAttribute('viewBox')||'0 0 1 1').split(/[ ,]+/).map(Number);
  if(!r.width||!r.height) return [1e9,1e9];
  // the drawing is scaled to fit and centred inside the box; undo exactly that
  const k=Math.min(r.width/vb[2], r.height/vb[3]);
  const ox=(r.width - vb[2]*k)/2, oy=(r.height - vb[3]*k)/2;
  return [ vb[0] + (cx - r.left - ox)/k, vb[1] + (cy - r.top - oy)/k ];
}
function hitSlack(){
  const r=svg.getBoundingClientRect();
  const vb=(svg.getAttribute('viewBox')||'0 0 1 1').split(/[ ,]+/).map(Number);
  if(!r.width||!r.height) return R+6;
  const k=Math.min(r.width/vb[2], r.height/vb[3]);
  return Math.max(R+6, 24/k);            // never smaller than a fingertip
}
function hitHook(ev){
  const q=boardPoint(ev); let best=-1, bd=1e9;
  for(let i=0;i<P.nh;i++){                 // never past this board's hooks
    if(!hitPts[i]) continue;
    const d=Math.hypot(hitPts[i][0]-q[0], hitPts[i][1]-q[1]);
    if(d<bd){bd=d;best=i;}
  }
  return bd<=hitSlack() ? best : -1;
}
let downOn=-1, downAt=null;
svg.addEventListener('pointerdown',function(e){ downOn=hitHook(e); downAt=[e.clientX,e.clientY]; },{passive:true});
svg.addEventListener('pointerup',function(e){
  // the box can resize between down and up, so trust how far the finger moved, not a second hit test
  const moved=downAt?Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]):1e9;
  if(downOn>=0 && moved<14) tapHook(downOn);
  downOn=-1; downAt=null;
},{passive:true});
svg.addEventListener('pointercancel',function(){downOn=-1;downAt=null;});
document.addEventListener('touchstart',function(e){if(e.target.closest('#board'))e.preventDefault();},{passive:false});

load(); window.scrollTo(0,0); requestAnimationFrame(frame);
</script>
